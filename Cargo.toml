[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/shell",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/Binaryinject/natpierce-keepalive"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
# WebSocket
tokio-tungstenite = "0.30"
futures-util = "0.3"
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["time", "env-filter", "fmt", "chrono"] }
tracing-appender = "0.2"
# 错误处理
anyhow = "1"
# 时间
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
