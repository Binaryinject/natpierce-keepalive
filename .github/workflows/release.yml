name: Release

# 触发方式：
#   1. 推送形如 v0.1.0 的 tag
#   2. 手动触发（Actions 页面 → Run workflow）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------
  # 构建 Windows 产物
  # ------------------------------------------------------------
  build-windows:
    name: 构建 Windows 产物
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 编译（release）
        run: cargo build --release --workspace

      - name: 运行单元测试
        run: cargo test --release -p natpierce-core

      - name: 整理便携版
        shell: pwsh
        run: |
          # 版本号取自 tag（v0.1.2 → 0.1.2）；手动触发时退回 Cargo.toml
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          if ($ver -notmatch '^\d+\.\d+\.\d+') {
            $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          }
          Write-Host "版本号: $ver"

          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item target\release\natpierce-gui.exe         portable\
          Copy-Item target\release\natpierce-keepalived.exe  portable\
          Copy-Item config.example.json                      portable\
          Copy-Item README.md                                portable\

          $zip = "natpierce-keepalive-$ver-portable.zip"
          Compress-Archive -Path portable\* -DestinationPath $zip -Force
          "ZIP_NAME=$zip" >> $env:GITHUB_ENV
          Get-ChildItem portable | Select-Object Name, Length | Format-Table -AutoSize
          Write-Host "便携版: $zip ($((Get-Item $zip).Length) bytes)"
      - name: 安装 Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: 构建 NSIS 安装包
        shell: pwsh
        working-directory: crates/shell
        run: |
          # hooks.nsh 用 ${__FILEDIR__}\..\..\ 定位守护进程（即 target\release\），
          # 所以只要前面编译成功即可，无需额外复制
          $daemon = "$env:GITHUB_WORKSPACE\target\release\natpierce-keepalived.exe"
          if (-not (Test-Path $daemon)) { throw "守护进程不存在: $daemon" }
          Write-Host "守护进程: $((Get-Item $daemon).Length) bytes"

          tauri --version
          tauri build --bundles nsis

          Get-ChildItem ..\..\target\release\bundle\nsis\*.exe |
            Select-Object Name, Length | Format-Table -AutoSize

      - name: 统一产物命名
        shell: pwsh
        run: |
          # Tauri 生成的安装包名带下划线（natpierce-keepalive_0.1.2_x64-setup.exe），
          # 这里统一成 natpierce-keepalive-<版本>-setup.exe，与便携版风格一致。
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          if ($ver -notmatch '^\d+\.\d+\.\d+') {
            $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          }

          $nsis = Get-ChildItem target\release\bundle\nsis\*.exe -EA SilentlyContinue | Select-Object -First 1
          if (-not $nsis) { throw "未生成 NSIS 安装包" }
          Write-Host "原始安装包: $($nsis.Name)"

          $setup = "natpierce-keepalive-$ver-setup.exe"
          Copy-Item $nsis.FullName $setup -Force
          "SETUP_NAME=$setup" >> $env:GITHUB_ENV
          Write-Host "重命名后: $setup ($((Get-Item $setup).Length) bytes)"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          # 只发布安装包与便携版：两个 exe 已经在便携版 zip 里，
          # NSIS 安装包也通过 installerHooks 附带守护进程，
          # 单独再挂一份裸 exe 只会让下载页多两个冗余项。
          path: |
            natpierce-keepalive-*-setup.exe
            natpierce-keepalive-*-portable.zip
          if-no-files-found: error

  # ------------------------------------------------------------
  # 创建 Release
  # ------------------------------------------------------------
  release:
    name: 发布 Release
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts

      - name: 列出文件
        run: find artifacts -type f | sort

      - name: 说明文件
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## natpierce-keepalive

          皎月连（natpierce）连接保活守护 —— 服务端 / 客户端双模式，图形界面 + 独立守护进程。

          ### 下载哪个

          | 文件 | 说明 |
          |---|---|
          | `natpierce-keepalive-<版本>-setup.exe` | NSIS 安装包，双击安装（推荐，按当前用户安装，无需管理员） |
          | `natpierce-keepalive-<版本>-portable.zip` | 便携版，解压即用 |

          ### 首次使用

          1. 启动 `natpierce-gui.exe`
          2. 界面会弹出红色警告框，逐条列出缺什么 → 点「浏览…」选择你的 `natpierce.exe`
          3. 填写「页面访问密码」（皎月连界面里的 6-20 位密码，组网模式下必填）
          4. 点「保存配置」→ **保活自动开启**，之后不用再管

          客户端模式则把「目标识别码」填上（可直接在「在线主机」列表点选）。

          ### 主要特性

          - 服务端 / 客户端双模式（互斥），配好即自动保活
          - 三层判据：进程层 / 服务层 / 心跳层，逐级定位再对症恢复
          - 服务端模式自动先开「组网模式」，再开启服务端
          - 界面内嵌运行日志，启动/恢复全过程直接可见
          - 配置热重载、优雅停止、防重启风暴
          - 密码用 Windows DPAPI 加密，不明文落盘
          - 只与本机 `127.0.0.1:33272` 通信，不向外发送数据

          ### 环境要求

          Windows 10/11 + WebView2（系统通常自带）

          详见 [README](https://github.com/${{ github.repository }}#readme)。
          EOF

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
