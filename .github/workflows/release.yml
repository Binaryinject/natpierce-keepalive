name: Release

# 触发方式：
#   1. 推送形如 v0.1.0 的 tag
#   2. 手动触发（Actions 页面 → Run workflow）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v0.1.0），留空则用 Cargo.toml 里的版本"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------
  # 构建 Windows 安装包
  # ------------------------------------------------------------
  build-windows:
    name: 构建 Windows 安装包
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 编译（release）
        run: cargo build --release --workspace

      - name: 运行单元测试
        run: cargo test --release -p natpierce-core

      - name: 整理产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\natpierce-gui.exe        dist\
          Copy-Item target\release\natpierce-keepalived.exe dist\
          Copy-Item config.example.json                     dist\
          Copy-Item README.md                               dist\
          # 便携版压缩包（两个 exe + 配置模板，解压即用）
          Compress-Archive -Path dist\* `
            -DestinationPath "natpierce-keepalive-portable.zip" -Force
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: 安装 Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: 构建 NSIS 安装包
        shell: pwsh
        working-directory: crates/shell
        run: |
          # 把两个 exe 放进 bundle 目录一并打包
          cargo tauri build --no-bundle
          # 生成安装包
          cargo tauri bundle --bundles nsis
          # 收集产物
          Get-ChildItem ..\..\target\release\bundle\nsis\*.exe -ErrorAction SilentlyContinue |
            Copy-Item -Destination ..\..\ -Force

      - name: 上传构建产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            target/release/natpierce-gui.exe
            target/release/natpierce-keepalived.exe
            target/release/bundle/nsis/*.exe
            natpierce-keepalive-portable.zip
          if-no-files-found: warn

  # ------------------------------------------------------------
  # 创建 Release 并上传安装包
  # ------------------------------------------------------------
  release:
    name: 发布 Release
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts

      - name: 列出下载到的文件
        run: find artifacts -type f | sort

      - name: 生成 Release 说明
        id: notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## 皎月连保活守护

          ### 下载
          - **`*-setup.exe`** —— NSIS 安装包，双击安装（推荐）
          - **`natpierce-keepalive-portable.zip`** —— 便携版，解压即用

          ### 首次使用
          1. 启动 `natpierce-gui.exe`
          2. 界面顶部会提示缺什么，点「浏览…」选择你的 `natpierce.exe`
          3. 填写「页面访问密码」（皎月连界面里的 6-20 位密码）
          4. 点「保存配置」—— 保活会自动开启

          ### 说明
          - 支持服务端 / 客户端双模式（互斥）
          - 密码使用 Windows DPAPI 加密，不会明文落盘
          - 只与本机 `127.0.0.1:33272` 通信，不向外发送数据
          - 需要 Windows 10/11 与 WebView2（系统通常自带）

          详见 [README](https://github.com/${{ github.repository }}#readme)。
          EOF
          echo "ok" >> "$GITHUB_OUTPUT"

      - name: 创建 / 更新 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
